<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>專案名稱佔位（一） - RUAN_ZI_RUI Personal Information Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 絕對路徑，巢狀在 portfolio/ 子目錄下也能正確載入，不需要調整成相對路徑 -->
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body>
    <!-- header/nav/footer 是從 src/pages/index.html 手動複製過來的（目前專案沒有
         建置工具／樣板系統，這是已知的維護代價，見 FuturePlan.md「規劃三」補記）。
         之後 header/nav 改版時，記得同步修改這裡。 -->
    <header class="site-header">
      <div class="site-header__title">
        <h1 class="site-header__title-cn">阮梓睿</h1>
        <p class="site-header__title-en">
          <span class="site-header__title-en-accent">r</span>uan_zi_rui
        </p>
        <span class="site-header__title-divider" aria-hidden="true"></span>
        <p class="site-header__title-tagline">資訊管理・全端開發</p>
      </div>
      <!-- nav 連結全部改成絕對路徑指回首頁對應錨點：這個頁面不是首頁本身，
           裸 href="#about" 這種寫法會變成在這支子頁面裡找不到對應區塊 -->
      <nav class="site-nav">
        <!-- 漢堡選單按鈕：跟 index.html 同步補上（RWD 分階段規劃 Phase 4 發現遺漏）。
             這支子頁面原本沒有這顆按鈕，導致 768px 以下 .site-nav__list 被 CSS 收合成
             max-height:0 卻沒有任何方式展開，整份導覽選單在手機/平板寬度完全打不開 -->
        <button
          class="site-nav__toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav-list"
          aria-label="開啟導覽選單"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <ul class="site-nav__list" id="site-nav-list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#about">個人介紹</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#resume">履歷</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#skills">技能</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#portfolio">作品集</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#activities">課外經歷</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#casestudy">案例故事</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#notes">學習筆記</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#goals">目標願景</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="/src/pages/index.html#contact">聯絡方式</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main" class="site-main">
      <section class="section casestudy">
        <a class="casestudy__back-link" href="/src/pages/index.html#portfolio"
          >← 回作品集</a
        >

        <h1 class="casestudy__name">專案名稱佔位（一）</h1>

        <!-- 深度說明沿用 #casestudy 已經設計好的五段式敘事 class，不另外發明新一套，
             因為「作品的深度說明」本來就是 casestudy__block 這套視覺語彙要處理的事 -->
        <div class="casestudy__block">
          <h4 class="casestudy__block-label">背景</h4>
          <p class="casestudy__block-text">
            背景佔位（為什麼要做？課程作業／競賽／自己想解決的問題？）
          </p>
        </div>

        <div class="casestudy__block">
          <h4 class="casestudy__block-label">目標</h4>
          <p class="casestudy__block-text">目標佔位（想達成什麼？）</p>
        </div>

        <div class="casestudy__block">
          <h4 class="casestudy__block-label">過程</h4>
          <p class="casestudy__block-text">
            過程佔位（怎麼規劃？設計 → 實作 → 測試）
          </p>
        </div>

        <div class="casestudy__block">
          <h4 class="casestudy__block-label">挑戰</h4>
          <p class="casestudy__block-text">
            挑戰佔位（遇到什麼困難？怎麼解決？）
          </p>
        </div>

        <div class="casestudy__block">
          <h4 class="casestudy__block-label">成果與收穫</h4>
          <p class="casestudy__block-text">
            成果與收穫佔位（最後做出來是什麼樣子？學到什麼？下次會怎麼改進？）
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">&copy; 2026 你的名字</p>
    </footer>

    <!-- 只需要漢堡選單開關邏輯（跟 index.html 同步補上，RWD 分階段規劃 Phase 4）；
         filter.js／contact-mailto.js 是給 index.html 的篩選器/表單用，這支子頁面
         沒有這兩種元件，不需要引入 -->
    <script src="/src/scripts/nav-scroll.js" defer></script>
  </body>
</html>
