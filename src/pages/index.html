<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUAN_ZI_RUI Personal Information Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- site-header 是 Block；site-header__title 是它底下的 Element，
         只能存在於 site-header 裡面，不會被單獨拿去別的地方用 -->
    <header class="site-header">
      <h1 class="site-header__title">阮梓睿 RUAN ZI RUI</h1>
      <!-- site-nav 是「獨立的另一個 Block」，不是 site-header 的 Element，
           因為導覽列本身也是一個可以獨立存在、重複使用的元件 -->
      <nav class="site-nav">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="#about">自我介紹</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="#works">作品列表</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="#contact">聯絡方式</a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="main" class="site-main">
      <!-- class="section about"：section 是三個區塊共用的樣式（例如統一間距），
           about 是這個區塊專屬的樣式；id="about" 則保留給上面 <a href="#about"> 錨點跳轉用，
           跟 class 負責的事情分開，不要混用 -->
      <section id="about" class="section about">
        <h2 class="section__title">自我介紹</h2>
        <p class="about__text">這裡寫一段簡短的自我介紹。</p>
      </section>

      <section id="works" class="section works">
        <h2 class="section__title">作品列表</h2>
        <!-- works__list 是 Block(works)底下的 Element；
             每個 works__item 都重複同樣的結構，之後要新增作品只要照抄一行 li -->
        <ul class="works__list">
          <li class="works__item"><a class="works__link" href="#">作品一</a></li>
          <li class="works__item"><a class="works__link" href="#">作品二</a></li>
        </ul>
      </section>

      <section id="contact" class="section contact">
        <h2 class="section__title">聯絡方式</h2>
        <p class="contact__text">
          Email：<a class="contact__link" href="mailto:asyray951223@gmail.com"
            >asyray951223@gmail.com</a
          >
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">&copy; 2026 你的名字</p>
    </footer>
  </body>
</html>
